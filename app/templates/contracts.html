<!doctype html>
<html><head><meta charset="utf-8"><title>LedgerWeb | Contracts</title>
<style>body{font-family:sans-serif;margin:24px}td,th{padding:4px 10px;border-bottom:1px solid #ddd}</style>
</head><body>
<h1>Contracts</h1>
<form method="get">
  <label for="{{ filter_id }}">Contract №</label>
  <input id="{{ filter_id }}" name="q" value="{{ q }}">
  <button id="BTN_FILTER" type="submit">Filter</button>
</form>
<table id="contracts">
  <tr><th>Contract</th><th>Supplier</th><th></th></tr>
  {% for no, c in rows.items() %}
  <tr data-contract="{{ no }}"><td>{{ no }}</td><td>{{ c.supplier }}</td>
    <td><a class="create" href="/doc/new?contract={{ no }}">Create document</a></td></tr>
  {% endfor %}
</table>
</body></html>
